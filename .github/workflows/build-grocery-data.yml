name: Build grocery data
on:
  workflow_dispatch:
  push:
    paths:
      - 'imports/**.xlsx'
      - 'scripts/**'
      - 'src/**'
      - 'worker.js'
      - 'wrangler.jsonc'
      - 'package.json'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-data.txt
      - name: Normalize imports
        run: |
          mkdir -p normalized public/data
          shopt -s nullglob
          for f in imports/*.xlsx; do
            out="normalized/$(basename "${f%.xlsx}").json"
            python scripts/import_xlsx.py "$f" "$out"
          done
      - name: Build generated catalog
        run: python scripts/build_catalog.py 'normalized/*.json' public/data/generated-catalog.json
      - name: Verify generated catalog
        run: |
          python - <<'PY'
          import json
          p='public/data/generated-catalog.json'
          with open(p,encoding='utf-8') as f:
              data=json.load(f)
          print('Generated catalog verified:', p)
          PY
