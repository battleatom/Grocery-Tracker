name: Build grocery data
on:
  workflow_dispatch:
  push:
    paths:
      - 'imports/**.xlsx'
      - 'scripts/**'
      - 'src/**'
      - 'worker.js'
      - 'wrangler.jsonc'
      - 'package.json'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-data.txt
      - name: Normalize imports
        run: |
          mkdir -p normalized public/data
          shopt -s nullglob
          for f in imports/*.xlsx; do
            out="normalized/$(basename "${f%.xlsx}").json"
            python scripts/import_xlsx.py "$f" "$out"
          done
      - name: Build generated catalog
        run: python scripts/build_catalog.py 'normalized/*.json' public/data/generated-catalog.json
      - name: Commit generated data
        run: |
          git config user.name "grocery-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add normalized public/data/generated-catalog.json
          if git diff --cached --quiet; then
            echo "Generated catalog unchanged"
            exit 0
          fi
          git commit -m "Rebuild normalized grocery catalog"
          git pull --rebase origin main
          git push origin HEAD:main
