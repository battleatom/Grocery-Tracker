name: Refresh local grocery prices
on:
  push:
    paths:
      - 'scripts/refresh-prices.mjs'
      - '.github/workflows/refresh-prices.yml'
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: grocery-price-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/refresh-prices.mjs
        env:
          KROGER_CLIENT_ID: ${{ secrets.KROGER_CLIENT_ID }}
          KROGER_CLIENT_SECRET: ${{ secrets.KROGER_CLIENT_SECRET }}
          THUNDERBIT_API_SCRAPER: ${{ secrets.THUNDERBIT_API_SCRAPER }}
          SCRAPEOPS_API_KEY: ${{ secrets.SCRAPEOPS_API_KEY }}
      - name: Commit verified changes
        run: |
          git config user.name "grocery-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/prices.json public/data/history.json public/data/deals.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Daily Farmington grocery price and deal refresh"
          git push
