name: Refresh local grocery prices
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/refresh-prices.mjs
      - name: Commit verified changes
        run: |
          git config user.name "grocery-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/prices.json public/data/history.json
          git diff --cached --quiet || git commit -m "Refresh verified Farmington grocery prices"
          git push
